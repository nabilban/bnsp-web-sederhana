<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>System Integrator</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; }
        .box { max-width:700px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; }
        h1 { margin-top:0; font-size:1.4rem; }
        ul { padding-left:1.2rem; }
        a { color:#1976d2; text-decoration:none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>System Integrator — Deployment Berhasil ✅ </h1>
        <p>Aplikasi Node.js dilayani lewat Express.js.</p>

        <h3>Informasi Server</h3>
        <ul>
            <li><strong>Port:</strong> 8080</li>
            <li><strong>URL:</strong> <a href="http://localhost:8080" target="_blank">http://localhost:8080</a></li>
            <li><strong>Framework:</strong> Express.js</li>
            <li><strong>Status:</strong> Online</li>
        </ul>

        <h3>Endpoints</h3>
        <ul>
            <li>GET / — index.html</li>
            <li>GET /static/* — static files</li>
        </ul>
    </div>
</body>
</html>
